version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vazhi_postgres
    restart: always
    environment:
      POSTGRES_USER: vazhi_user
      POSTGRES_PASSWORD: vazhi_password
      POSTGRES_DB: vazhi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vazhi_user -d vazhi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vazhi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://vazhi_user:vazhi_password@db:5432/vazhi_db
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
